name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install compiler dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run grammar 1 lexer tests
        run: python3 test/run_tests.py --stage lexer --grammar 1 --test grammar1/ -v --keep all

      - name: Upload lexer test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grammar1-lexer-output
          path: test/build/
          if-no-files-found: ignore
